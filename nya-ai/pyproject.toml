[project]
name = "nya-agent"
version = "0.1.0"
description = "Nya-AI agent service: LangGraph graph, LlamaIndex law library, Langfuse tracing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langfuse>=5.0.4",
    "langgraph>=1.2.18",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-azure-openai>=0.6.1",
    "llama-index-readers-file>=0.7.0",
    "llama-index-storage-docstore-postgres>=0.6.0",
    "llama-index-storage-kvstore-postgres>=0.4",
    "llama-index-vector-stores-postgres>=0.9.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "sqlalchemy>=2.0.55",
]

[project.scripts]
nya-agent = "nya_agent:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
