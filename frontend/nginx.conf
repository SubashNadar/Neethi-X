server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router-dom handles client-side routes (e.g. /bookings,
    # /account) that don't correspond to a real file on disk.
    location / {
        try_files $uri /index.html;
    }
}
