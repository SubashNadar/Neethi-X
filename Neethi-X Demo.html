document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:900,&quot;min&quot;:0,&quot;max&quot;:3000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Demo&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.chatRef = React.createRef();\n    this.mChatRef = React.createRef();\n    this.lChatRef = React.createRef();\n    const greet = { isAi: true, text: \"Namaste! I'm Neethi, your free AI legal assistant. Ask me anything — theft, rent disputes, FIRs, divorce, salary issues — and I'll explain your rights in plain language, grounded in Indian law.\", points: [], cite: \"\", cta: false };\n    this.state = {\n      device: 'desktop',\n      role: 'user',\n      selThread: 0, lReply: '',\n      threads: [\n        { id: 1, name: 'Priya S.', initials: 'PS', topic: 'Tenant deposit dispute', unread: true, msgs: [\n          { from: 'client', text: 'Sir, my landlord in Chennai is refusing to return my \\u20b950,000 deposit even 2 months after I vacated. Neethi told me about the Model Tenancy Act \\u2014 can you help me send a legal notice?' }\n        ]},\n        { id: 2, name: 'Vikram M.', initials: 'VM', topic: 'Cheque bounce (NI Act \\u00a7138)', unread: true, msgs: [\n          { from: 'client', text: 'A cheque of \\u20b91.2L issued to me bounced twice. What are my next steps before the 30-day notice window closes?' }\n        ]},\n        { id: 3, name: 'Anita R.', initials: 'AR', topic: 'Mutual consent divorce', unread: false, msgs: [\n          { from: 'client', text: 'We both agree to separate amicably. How long will mutual consent divorce take, and which documents should we prepare?' },\n          { from: 'lawyer', text: 'With mutual consent and 1 year of separation, expect 6\\u201312 months. Start collecting: marriage certificate, address proofs, and a draft settlement on maintenance and assets. We can cover details on our call.' }\n        ]}\n      ],\n      screen: props.startLoggedIn ? 'chat' : 'login',\n      loggedIn: !!props.startLoggedIn,\n      phone: '', otp: '', otpSent: false,\n      msgs: [greet], input: '', typing: false, userSent: false,\n      filter: 'All', selLawyer: null, selDay: 0, selSlot: null, selType: 'Video',\n      payMethod: 'upi', paying: false, paid: false,\n      available: true,\n      requests: [\n        { id: 1, name: 'Priya S.', initials: 'PS', topic: 'Tenant deposit dispute', when: 'Today · 6:00 PM', status: 'pending' },\n        { id: 2, name: 'Vikram M.', initials: 'VM', topic: 'Cheque bounce (NI Act §138)', when: 'Tomorrow · 11:00 AM', status: 'pending' },\n        { id: 3, name: 'Anita R.', initials: 'AR', topic: 'Mutual consent divorce query', when: 'Tomorrow · 4:00 PM', status: 'pending' }\n      ],\n      mTab: 'chat'\n    };\n    this.lawyers = [\n      { id: 1, name: 'Adv. Meera Krishnan', initials: 'MK', avBg: '#1F3A5F', cat: 'Criminal', spec: 'Criminal Law', exp: 12, langs: 'English, Tamil', rating: '4.9', reviews: 312, slot: 'Today 6:00 PM' },\n      { id: 2, name: 'Adv. Rohan Deshpande', initials: 'RD', avBg: '#2F6B57', cat: 'Property', spec: 'Property & Tenancy', exp: 8, langs: 'English, Hindi, Marathi', rating: '4.8', reviews: 204, slot: 'Today 7:30 PM' },\n      { id: 3, name: 'Adv. Sana Qureshi', initials: 'SQ', avBg: '#8A6A2E', cat: 'Family', spec: 'Family Law', exp: 10, langs: 'English, Hindi, Urdu', rating: '4.9', reviews: 287, slot: 'Tomorrow 11:00 AM' },\n      { id: 4, name: 'Adv. Arjun Nair', initials: 'AN', avBg: '#52606D', cat: 'Employment', spec: 'Employment & Corporate', exp: 6, langs: 'English, Malayalam', rating: '4.7', reviews: 156, slot: 'Tomorrow 4:00 PM' }\n    ];\n    const now = new Date();\n    const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n    this.days = [];\n    for (let i = 0; i < 5; i++) {\n      const d = new Date(now.getTime() + i * 864e5);\n nce must be registered.', 'Collect your free FIR copy. If refused, escalate to the Superintendent of Police or file online (most states allow it).'],\n      cite: 'Sources: CrPC \\u00a7154'\n    };\n    if (t.includes('divorce') || t.includes('marriage')) return {\n      text: 'For divorce, the route depends on your marriage law. The most common path:',\n      points: ['Mutual consent divorce (Sec 13B, Hindu Marriage Act) needs 1 year of separation and takes 6\\u201318 months.', 'Contested divorce requires grounds \\u2014 cruelty, desertion, adultery \\u2014 and takes longer.', 'Maintenance, custody and property can be settled by agreement to speed things up.'],\n      cite: 'Sources: Hindu Marriage Act \\u00a713B'\n    };\n    if (t.includes('salary') || t.includes('notice') || t.includes('employer') || t.includes('job')) return {\n      text: 'Notice-period and final-settlement disputes are governed by your contract plus state Shops & Establishments law:',\n      points: ['Earned salary can never be withheld \\u2014 it is legally recoverable.', 'Notice-period buyout depends on your contract; many employers allow it.', 'A lawyer\\u2019s legal notice resolves most of these without going to court.'],\n      cite: 'Sources: State S&E Acts, Payment of Wages Act'\n    };\n    return {\n      text: 'Here\\u2019s some general guidance while I understand your situation better:',\n      points: ['Keep every document, message and receipt related to the issue \\u2014 evidence wins cases.', 'Write down the timeline of events; dates matter a lot in law.', 'Most disputes have a limitation period, so acting early protects your rights.'],\n      cite: ''\n    };\n  }\n\n  send(text) {\n    const msg = (text || '').trim();\n    if (!msg || this.state.typing) return;\n    this.setState(s => ({ msgs: [...s.msgs, { isUser: true, text: msg }], input: '', typing: true, userSent: true }));\n    const delay = this.props.aiDelayMs ?? 900;\n    setTimeout(() => {\n      const a = this.answerFor(msg);\n      this.setState(s => ({ typing: false, msgs: [...s.msgs, { isAi: true, text: a.text, points: a.points, cite: a.cite, cta: true }] }));\n    }, delay);\n  }\n\n  sendReply() {\n    const txt = (this.state.lReply || '').trim();\n    if (!txt) return;\n    const i = this.state.selThread;\n    this.setState(s => ({\n      lReply: '',\n      threads: s.threads.map((t, j) => j === i ? { ...t, msgs: [...t.msgs, { from: 'lawyer', text: txt }] } : t)\n    }));\n  }\n\n  pay(mobile) {\n    if (this.state.selSlot === null || this.state.paying) return;\n    this.setState({ paying: true });\n    setTimeout(() => {\n      this.setState({ paying: false, paid: true, screen: 'success', mTab: 'done' });\n    }, 1600);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const st = (p) => this.setState(p);\n    const A = '#1F3A5F', SOFT = '#EAF1F8', LINE = '#E2E7EF', INK = '#1B2430', MUT = '#667085';\n    const screen = s.screen, dev = s.device;\n    const inApp = s.loggedIn && screen !== 'login';\n    const unread = s.threads.filter(t => t.unread).length;\n    const nav = (s.role === 'lawyer' ? [\n      { label: 'Dashboard', key: 'portal' },\n      { label: unread ? 'Client Messages (' + unread + ')' : 'Client Messages', key: 'lmsgs' },\n      { label: 'My Profile', key: 'lprofile' }\n    ] : [\n      { label: 'Chat with Neethi', key: 'chat' },\n      { label: 'Find a Lawyer', key: 'lawyers' },\n      { label: 'My Consultations', key: 'dashboard' }\n    ]).map(n => {\n      const active = screen === n.key || (n.key === 'lawyers' && ['booking', 'pay', 'success'].includes(screen));\n      return { label: n.label, go: () => st({ screen: n.key }), bg: active ? SOFT : 'transparent', c: active ? INK : '#4B5563', w: active ? 700 : 500, dot: active ? A : LINE };\n    });\n    const chips = [\n      'What is theft under IPC?',\n      'My landlord won\\u2019t return my deposit',\n      'How do I file an FIR?',\n      'Employer is holding my final salary'\n    ].map(q => ({
